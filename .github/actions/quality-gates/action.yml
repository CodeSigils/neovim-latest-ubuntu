name: Neovim quality gates
description: Shared lint, policy, syntax, and regression checks
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: requirements-dev.txt
    - name: Install repository validation tools
      shell: bash
      run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
    - name: Check Python quality and formatting
      shell: bash
      run: |
        ruff check scripts tests
        ruff format --check scripts tests
    - name: Run dependency consistency check
      shell: bash
      run: python3 scripts/check-dependencies.py
    - name: Run shellcheck
      shell: bash
      run: shellcheck build.sh test.sh scripts/*.sh .githooks/prepare-commit-msg
    - name: Validate YAML workflow syntax
      shell: bash
      run: python3 scripts/check-yaml-syntax.py
    - name: Validate GitHub Actions semantics
      shell: bash
      run: >-
        docker run --rm
        -v "$GITHUB_WORKSPACE:/repo:ro"
        --workdir /repo
        rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
        -color
    - name: Audit GitHub Actions security
      shell: bash
      run: zizmor --offline --min-severity medium --min-confidence medium .
    - name: Run regression tests
      shell: bash
      run: python3 -m unittest discover -s tests -p 'test_*.py'
    - name: Run hadolint
      uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
      with:
        dockerfile: Containerfile
