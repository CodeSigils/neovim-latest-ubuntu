name: Build and release stable Neovim

concurrency:
  group: stable-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'docs/**'
      - 'wallpapers/**'
      - '.gitattributes'
      - '.gitignore'
      - '.githooks/**'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - '.mailmap'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - 'tests/**'
      - 'scripts/check-dependencies.py'
      - 'scripts/check-markdown-links.py'
      - 'scripts/check-release-readiness.sh'
      - 'scripts/check-repository-settings.py'
      - 'scripts/check-yaml-syntax.py'
      - 'scripts/report-action-freshness.py'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'docs/**'
      - 'wallpapers/**'
      - '.gitattributes'
      - '.gitignore'
      - '.githooks/**'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - '.mailmap'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - 'tests/**'
      - 'scripts/check-dependencies.py'
      - 'scripts/check-markdown-links.py'
      - 'scripts/check-release-readiness.sh'
      - 'scripts/check-repository-settings.py'
      - 'scripts/check-yaml-syntax.py'
      - 'scripts/report-action-freshness.py'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Stable Neovim version without v; empty means latest
        required: false
        default: ''
        type: string
      publish:
        description: Publish after successful verification
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UBUNTU_VERSION: ${{ vars.UBUNTU_VERSION || '26.04' }}
  UBUNTU_CODENAME: ${{ vars.UBUNTU_CODENAME || 'Resolute Raccoon' }}
  UBUNTU_SHA256: ${{ vars.UBUNTU_SHA256 || 'f3d28607ddd78734bb7f71f117f3c6706c666b8b76cbff7c9ff6e5718d46ff64' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      package_revision: ${{ steps.plan.outputs.package_revision }}
      publish: ${{ steps.plan.outputs.publish }}
      reason: ${{ steps.plan.outputs.reason }}
      requires_review: ${{ steps.plan.outputs.requires_review }}
      should_build: ${{ steps.plan.outputs.should_build }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve exact source and release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish || 'false' }}
        run: |
          mode=ci
          version=latest
          publish_arg=()
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            mode=scheduled
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            mode=manual
            version="${INPUT_VERSION:-latest}"
            if [[ "$INPUT_PUBLISH" == true ]]; then
              publish_arg=(--publish)
            fi
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            mode=tag
            version="$GITHUB_REF_NAME"
          fi
          python3 scripts/plan-release.py \
            --mode "$mode" \
            --version "$version" \
            "${publish_arg[@]}" \
            --github-output "$GITHUB_OUTPUT"

  package:
    needs: plan
    if: needs.plan.outputs.should_build == 'true' && github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      source_commit: ${{ needs.plan.outputs.source_commit }}
      package_revision: ${{ needs.plan.outputs.package_revision }}
      artifact_prefix: stable-deb
      retention_days: 7
      run_lintian: true

  release:
    needs: [plan, package]
    if: needs.plan.outputs.publish == 'true' && needs.package.result == 'success'
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment:
      name: ${{ needs.plan.outputs.requires_review == 'true' && 'release-reviewed' || 'release-auto' }}
      url: ${{ steps.publish.outputs.url }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: stable-deb-*
          merge-multiple: true

      - name: Verify complete release candidate
        env:
          PACKAGE_REVISION: ${{ needs.plan.outputs.package_revision }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
          UPSTREAM_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          expected=(
            nvim-linux-x86_64.deb
            nvim-linux-arm64.deb
            BUILD-METADATA-amd64.json
            BUILD-METADATA-arm64.json
          )
          shopt -s nullglob
          actual=(./*.deb)
          if [[ "${#actual[@]}" -ne 2 ]]; then
            echo "Error: expected exactly two release packages" >&2
            exit 1
          fi
          for artifact in "${expected[@]}"; do
            [[ -f "$artifact" ]] || { echo "Error: missing $artifact" >&2; exit 1; }
          done
          [[ "$(dpkg-deb -f nvim-linux-x86_64.deb Architecture)" == amd64 ]]
          [[ "$(dpkg-deb -f nvim-linux-arm64.deb Architecture)" == arm64 ]]
          python3 scripts/verify-release-candidate.py \
            --version "$UPSTREAM_VERSION" \
            --package-revision "$PACKAGE_REVISION" \
            --source-commit "$SOURCE_COMMIT" \
            --repository-commit "$GITHUB_SHA" \
            --ubuntu-version "$UBUNTU_VERSION" \
            --ubuntu-codename "$UBUNTU_CODENAME" \
            --ubuntu-image-digest "$UBUNTU_SHA256"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: '*.deb'

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          UPSTREAM_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          Neovim ${RELEASE_TAG} packaged as a native \`.deb\` for Ubuntu ${UBUNTU_VERSION} LTS (${UBUNTU_CODENAME})-based systems.

          **Install:**

          \`\`\`bash
          sudo dpkg -i nvim-linux-<arch>.deb
          nvim --version
          \`\`\`

          **Verify:**

          \`\`\`bash
          sha256sum --ignore-missing -c SHA256SUMS
          gh attestation verify nvim-linux-<arch>.deb -R ${GITHUB_REPOSITORY}
          \`\`\`

          - [Upstream release notes](https://github.com/neovim/neovim/releases/tag/v${UPSTREAM_VERSION})
          - Build metadata is included for both architectures.
          EOF

      - name: Create or resume draft and publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          assets=(
            nvim-linux-x86_64.deb
            nvim-linux-arm64.deb
            SHA256SUMS
            BUILD-METADATA-amd64.json
            BUILD-METADATA-arm64.json
          )
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$state" != true ]]; then
              echo "Published release $RELEASE_TAG already exists; refusing to mutate it." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Neovim $RELEASE_TAG" \
              --notes-file release-notes.md \
              --draft
          fi
          mapfile -t expected_assets < <(printf '%s\n' "${assets[@]}" | sort)
          mapfile -t actual_assets < <(
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort
          )
          if [[ "${actual_assets[*]}" != "${expected_assets[*]}" ]]; then
            echo "Draft release contains an unexpected or incomplete asset set." >&2
            printf 'Expected: %s\n' "${expected_assets[*]}" >&2
            printf 'Actual:   %s\n' "${actual_assets[*]}" >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
          url=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
          echo "url=$url" >> "$GITHUB_OUTPUT"

  report-failure:
    needs: [plan, package, release]
    if: >-
      always() &&
      (needs.plan.result == 'failure' ||
      (needs.plan.outputs.publish == 'true' &&
      (needs.package.result == 'failure' || needs.release.result == 'failure')))
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create or update release failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG || '(planning failed)';
            const title = `Stable release automation failed: ${tag}`;
            const body = [
              'Automated stable-release processing requires maintainer attention.',
              '',
              `- **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- **Plan:** ${{ needs.plan.result }}`,
              `- **Package:** ${{ needs.package.result }}`,
              `- **Release:** ${{ needs.release.result }}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'new-release'
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['new-release']
              });
            }

  report-success:
    needs: [plan, release]
    if: needs.plan.outputs.publish == 'true' && needs.release.result == 'success'
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close resolved release failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const title = `Stable release automation failed: ${tag}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'new-release'
            });
            for (const issue of issues.filter(issue => issue.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved by successful release ${tag}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
