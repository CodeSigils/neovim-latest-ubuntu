name: Nightly Build

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Resolve current Neovim master commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(gh api repos/neovim/neovim/commits/master --jq '.sha')
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Error: upstream returned an invalid commit SHA" >&2
            exit 1
          }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    uses: ./.github/workflows/package.yml
    with:
      version: nightly
      source_commit: ${{ needs.resolve.outputs.source_commit }}
      artifact_prefix: nvim-nightly-deb
      retention_days: 30
      run_lintian: false

  report-failure:
    needs: [resolve, package]
    if: >-
      always() && github.event_name != 'workflow_dispatch' &&
      (needs.resolve.result == 'failure' || needs.package.result == 'failure')
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create or update nightly failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = 'Nightly build failed';
            const body = [
              'The automated build of Neovim `master` requires maintainer attention.',
              '',
              `- **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- **Date:** ${new Date().toISOString().slice(0, 10)}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['nightly']
              });
            }

  report-success:
    needs: [resolve, package]
    if: >-
      always() && github.event_name != 'workflow_dispatch' &&
      needs.resolve.result == 'success' && needs.package.result == 'success'
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close recovered nightly failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly',
              per_page: 100
            });
            for (const issue of issues.filter(issue => issue.title === 'Nightly build failed')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'The nightly build has recovered.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
