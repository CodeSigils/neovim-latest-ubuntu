name: Nightly Build

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 6 * * *'   # Daily: 06:00 UTC (same time as weekly stable build)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UBUNTU_VERSION: ${{ vars.UBUNTU_VERSION || '26.04' }}
  UBUNTU_CODENAME: ${{ vars.UBUNTU_CODENAME || 'Resolute Raccoon' }}
  UBUNTU_SHA256: ${{ vars.UBUNTU_SHA256 || 'f3d28607ddd78734bb7f71f117f3c6706c666b8b76cbff7c9ff6e5718d46ff64' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run shared quality gates
        uses: ./.github/actions/quality-gates

  build:
    if: github.actor != 'dependabot[bot]'
    needs: lint
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
            deb_arch: amd64
            deb_file: nvim-linux-x86_64.deb
          - arch: aarch64
            runner: ${{ vars.RUNNER_AARCH64 || 'ubuntu-24.04-arm' }}
            deb_arch: arm64
            deb_file: nvim-linux-arm64.deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build container image
        run: >
          docker build -t neovim-builder
          --build-arg UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
          --build-arg UBUNTU_CODENAME="${{ env.UBUNTU_CODENAME }}"
          --build-arg UBUNTU_SHA256=${{ env.UBUNTU_SHA256 }}
          -f Containerfile .

      - name: Build nightly Neovim
        run: |
          mkdir -p output
          docker run --rm \
            -e VERSION=nightly \
            -v "$PWD/output:/output" \
            neovim-builder

      - name: Verify artifact exists
        run: |
          shopt -s nullglob
          debs=(output/*.deb)
          if [ "${#debs[@]}" -ne 1 ] || [ "${debs[0]##*/}" != "${{ matrix.deb_file }}" ]; then
            echo "Error: Expected exactly output/${{ matrix.deb_file }}" >&2
            ls -la output/
            exit 1
          fi
          actual_arch=$(dpkg-deb -f "output/${{ matrix.deb_file }}" Architecture)
          if [ "$actual_arch" != "${{ matrix.deb_arch }}" ]; then
            echo "Error: Expected Debian architecture ${{ matrix.deb_arch }}, got $actual_arch" >&2
            exit 1
          fi
          ls -lh output/

      - name: Generate SHA256 checksums
        run: |
          cd output
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Test .deb package
        run: |
          DEB_NAME="${{ matrix.deb_file }}"
          echo "Testing: output/$DEB_NAME"
          # Run test.sh inside the build container: the .deb's runtime
          # deps (auto-generated by dpkg-shlibdeps) reference libraries
          # from the build environment, which may differ from the runner's.
          # The runner OS and container OS may differ (the runner is
          # ${{ matrix.runner }} while the container targets
          # $UBUNTU_VERSION) — running the test in the container avoids
          # dependency version skew.
          docker run --rm \
            -v "$PWD/test.sh:/tmp/test.sh:ro" \
            -v "$PWD/output:/output:ro" \
            neovim-builder \
            bash /tmp/test.sh "/output/$DEB_NAME" \
              "$(cat output/EXPECTED_SOURCE_VERSION)" \
              "$(cat output/EXPECTED_PACKAGE_VERSION)"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nvim-nightly-deb-${{ matrix.arch }}
          path: |
            output/*.deb
            output/SHA256SUMS
          retention-days: 30

  report-failure:
    needs: build
    if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for existing nightly failure issue
        id: check_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list \
            --repo ${{ github.repository }} \
            --label nightly \
            --state open \
            --json title \
            --jq '[.[] | select(.title | startswith("Nightly build failed —"))] | length' 2>/dev/null || echo "0")
          echo "count=$EXISTING" >> "$GITHUB_OUTPUT"
          echo "Existing open nightly issues: $EXISTING"

      - name: Create failure issue
        if: steps.check_issue.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create \
            --repo ${{ github.repository }} \
            --title "Nightly build failed — $(date +%Y-%m-%d)" \
            --label nightly \
            --body "The nightly build from Neovim \`master\` failed on $(date +%Y-%m-%d).

          **Run**: $RUN_URL
          **Event**: ${{ github.event_name }}
          **Branch**: ${{ github.ref_name }}

          Check the workflow run for details on which architecture(s) failed and why."

  report-success:
    needs: build
    if: ${{ success() && github.event_name != 'workflow_dispatch' }}
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for and close nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE=$(gh issue list \
            --repo ${{ github.repository }} \
            --label nightly \
            --state open \
            --json number,title \
            --jq '[.[] | select(.title | startswith("Nightly build failed —"))][0].number // empty' 2>/dev/null)
          if [ -n "$ISSUE" ]; then
            echo "Closing nightly failure issue #$ISSUE — build has recovered"
            gh issue comment "$ISSUE" \
              --repo ${{ github.repository }} \
              --body "Nightly build has been passing again since $(date +%Y-%m-%d). Closing."
            gh issue close "$ISSUE" \
              --repo ${{ github.repository }}
          else
            echo "No open nightly failure issues — all clear"
          fi
