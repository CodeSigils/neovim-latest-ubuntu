name: Check Upstream Release

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_NOTIFY_USER: CodeSigils

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get latest upstream Neovim release
        id: upstream
        run: |
          RESPONSE=$(curl -fsSL --max-time 20 --retry 3 --retry-delay 5 \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/neovim/neovim/releases/latest)
          TAG=$(echo "$RESPONSE" | jq -r '.tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "error=No release data from GitHub API" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "error=Unexpected upstream release tag format: $TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Get our latest built version
        id: ours
        run: |
          OUR_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$OUR_TAG" ]; then
            echo "version=none" >> "$GITHUB_OUTPUT"
          else
            RAW_VERSION="${OUR_TAG#v}"
            echo "version=${RAW_VERSION%%-*}" >> "$GITHUB_OUTPUT"
            echo "tag=$OUR_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare versions
        id: compare
        run: |
          UPSTREAM="${{ steps.upstream.outputs.version }}"
          OURS="${{ steps.ours.outputs.version }}"
          echo "upstream=$UPSTREAM"
          echo "ours=$OURS"
          if [ -z "$UPSTREAM" ]; then
            echo "result=error" >> "$GITHUB_OUTPUT"
          elif [ "$OURS" = "none" ]; then
            echo "result=new" >> "$GITHUB_OUTPUT"
          elif [ "$UPSTREAM" = "$OURS" ]; then
            echo "result=same" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n%s\n' "$OURS" "$UPSTREAM" | sort -V | tail -1)" = "$UPSTREAM" ]; then
            echo "result=new" >> "$GITHUB_OUTPUT"
          else
            echo "result=older" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release notification issue
        if: steps.compare.outputs.result == 'new'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const upstream = '${{ steps.upstream.outputs.tag }}';
            const mention = '@${{ env.RELEASE_NOTIFY_USER }}';
            const lastBuilt = '${{ steps.ours.outputs.tag }}' || '(none yet)';
            const body = mention + ' upstream Neovim ' + upstream + ' is available.\n\n'
              + '## New Neovim release detected\n\n'
              + '- **Upstream**: [' + upstream + '](https://github.com/neovim/neovim/releases/tag/' + upstream + ')\n'
              + '- **Last built**: ' + lastBuilt + '\n\n'
              + '### To ship\n\n'
              + 'Review the release, then tag and push it:\n\n'
              + '```bash\n'
              + 'git tag ' + upstream + '\n'
              + 'git push origin ' + upstream + '\n'
              + '```\n\n'
              + 'The scheduled build resolves `latest` dynamically; no source-version edit is required.';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'new-release'
            });
            const existing = issues.find(issue => issue.title.endsWith(upstream));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.notice('Updated release notification issue #' + existing.number + ' for ' + upstream);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'New upstream Neovim release: ' + upstream,
              body,
              labels: ['new-release']
            });

      - name: Close resolved release notification issues
        if: steps.compare.outputs.result == 'same'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'new-release'
            });
            for (const issue of issues.filter(issue => issue.title.startsWith('New upstream Neovim release:'))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Resolved: the repository is now tracking this upstream release.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
