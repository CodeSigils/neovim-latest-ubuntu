name: Repository maintenance

on:
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  report:
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit release-critical repository settings
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_VARIABLE_RUNNER_AARCH64: ${{ vars.RUNNER_AARCH64 }}
          REPOSITORY_VARIABLE_RUNNER_X86_64: ${{ vars.RUNNER_X86_64 }}
          REPOSITORY_VARIABLE_UBUNTU_CODENAME: ${{ vars.UBUNTU_CODENAME }}
          REPOSITORY_VARIABLE_UBUNTU_SHA256: ${{ vars.UBUNTU_SHA256 }}
          REPOSITORY_VARIABLE_UBUNTU_VERSION: ${{ vars.UBUNTU_VERSION }}
        run: python3 scripts/check-repository-settings.py
      - name: Report pinned action freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/report-action-freshness.py
