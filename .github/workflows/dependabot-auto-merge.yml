name: Dependabot safe auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  queue:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ${{ vars.RUNNER_X86_64 || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Queue low-risk dependency update
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t files < <(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename')
          ((${#files[@]} > 0)) || { echo 'No changed files; refusing auto-merge.'; exit 0; }
          for file in "${files[@]}"; do
            case "$file" in
              .github/dependabot.yml|requirements-dev.txt|.github/workflows/codeql.yml|.github/workflows/check-author.yml|.github/workflows/dependency-freshness.yml) ;;
              *) echo "Sensitive or unsupported path: $file"; exit 0 ;;
            esac
          done
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash --delete-branch
